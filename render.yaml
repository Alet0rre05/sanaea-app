# Blueprint de Render: backend (Django) + frontend (sitio estático).
# Crear desde el dashboard: New > Blueprint > seleccionar este repositorio.
# Las variables marcadas `sync: false` se piden al crear el servicio.
# La base de datos es PostgreSQL en Neon (externa a Render).

services:
  # ---------------------------------------------------------------- BACKEND
  - type: web
    name: sanaea-api
    runtime: python
    plan: starter            # el disco persistente requiere un plan pago
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "15"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_HSTS_SECONDS
        value: "31536000"
      - key: MEDIA_ROOT
        value: /var/data/planillas
      - key: DB_HOST
        sync: false          # host de Neon
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: FIELD_ENCRYPTION_KEY
        sync: false          # Fernet; ver README, sección "Claves"
      - key: JWT_REFRESH_TOKEN_DAYS
        sync: false          # pendiente de definir por el equipo
      - key: OTP_EXPIRY_MINUTES
        sync: false          # pendiente de definir por el equipo
      - key: OTP_MAX_ATTEMPTS
        sync: false          # pendiente de definir por el equipo
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # URL del sitio estático, ej. https://sanaea-web.onrender.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false          # proveedor SMTP pendiente de definir
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: no-reply@ajrdata.com.ar
    disk:
      name: planillas
      mountPath: /var/data/planillas
      sizeGB: 10

  # --------------------------------------------------------------- FRONTEND
  - type: web
    name: sanaea-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        sync: false          # ej. https://sanaea-api.onrender.com/api/v1
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
    routes:
      - type: rewrite        # SPA: cualquier ruta devuelve index.html
        source: /*
        destination: /index.html
